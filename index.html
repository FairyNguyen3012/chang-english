<title>Chặng English</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Gentium+Book+Plus:ital@0;1&display=swap">
<style>
/* Layout: one centered column of large rounded panels; learning paths as a zig-zag trail of numbered stops.
   Palette: deep-ocean blues with a coral counterpoint; Lexend (built for reading ease) for headings and UI, Be Vietnam Pro for running text. */
:root{
  --bg:#0C1525; --panel:#132034; --panel-2:#192940; --line:#283A57; --ink:#E7EEFA; --muted:#93A4C4;
  --brand:#5C9DFF; --brand-soft:#1B3561; --brand-ink:#07142A; --coral:#FF9178; --coral-deep:#45262A; --sand:#F2C65C; --slate:#31466A; --sq-ink:#0B1A33;
  --good:#4FD19A; --bad:#FF8C78; --glow:rgba(242,198,92,.35);
  --f-display:"Lexend", "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --f-body:"Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --f-phon:"Gentium Book Plus", "Charis SIL", "Doulos SIL", "Times New Roman", serif;
  /* type scale (rem, so the S / M / L switch scales everything) */
  --fs-xs:.75rem; --fs-sm:.875rem; --fs-md:1rem; --fs-lg:1.2rem; --fs-xl:1.5rem; --fs-2xl:2rem; --fs-3xl:clamp(2.3rem,5.6vw,4rem);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#EEF3FB; --panel:#FFFFFF; --panel-2:#F2F6FD; --line:#D3DEEF; --ink:#0E1F40; --muted:#53658A;
  --brand:#1C5FD8; --brand-soft:#DCE8FC; --brand-ink:#FFFFFF; --coral:#D2523D; --coral-deep:#FCE4DE; --sand:#A57710; --slate:#D7E2F3; --sq-ink:#0B1A33;
  --good:#16865A; --bad:#C8423A; --glow:rgba(231,180,60,.35); color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#EEF3FB; --panel:#FFFFFF; --panel-2:#F2F6FD; --line:#D3DEEF; --ink:#0E1F40; --muted:#53658A;
  --brand:#1C5FD8; --brand-soft:#DCE8FC; --brand-ink:#FFFFFF; --coral:#D2523D; --coral-deep:#FCE4DE; --sand:#A57710; --slate:#D7E2F3; --sq-ink:#0B1A33;
  --good:#16865A; --bad:#C8423A; --glow:rgba(231,180,60,.35); color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0C1525; --panel:#132034; --panel-2:#192940; --line:#283A57; --ink:#E7EEFA; --muted:#93A4C4;
  --brand:#5C9DFF; --brand-soft:#1B3561; --brand-ink:#07142A; --coral:#FF9178; --coral-deep:#45262A; --sand:#F2C65C; --slate:#31466A; --sq-ink:#0B1A33;
  --good:#4FD19A; --bad:#FF8C78; --glow:rgba(242,198,92,.35); color-scheme:dark;
}
html{font-size:16px}
html[data-size="s"]{font-size:14px} html[data-size="l"]{font-size:18px}
*{box-sizing:border-box}
[hidden]{display:none!important}
a{color:inherit}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs-md);line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button,.btn,.nav a,.step span,.opt{font-family:var(--f-display)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.02em;line-height:1.08}
.eyebrow{font-family:var(--f-display);font-size:var(--fs-xs);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.logo svg{width:34px;height:34px;flex:none}
.logo b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:-.025em;line-height:1}
.logo small{display:block;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:3px}
.nav{display:flex;gap:4px;margin:0 auto;flex-wrap:wrap}
.nav a{padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.92rem;position:relative}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink)}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px;background:var(--brand)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--coral);color:var(--sq-ink);font-size:.7rem;margin-left:4px;vertical-align:1px}
.tools{display:flex;gap:8px;align-items:center}
.pill-group{display:flex;border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px}
.pill-group button{width:30px;height:30px;border-radius:50%;border:0;background:none;cursor:pointer;font-weight:800;font-size:.78rem;color:var(--muted)}
.pill-group button[aria-pressed="true"]{background:var(--brand-soft);color:var(--ink)}
.theme-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:6px 12px;background:none;cursor:pointer;font-weight:700;font-size:.8rem}
.theme-btn svg{width:16px;height:16px}

main{padding-block:28px 72px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:12px;padding:12px 20px;font-weight:700;cursor:pointer;border:1.5px solid var(--line);background:transparent;color:var(--ink);text-decoration:none;font-size:.95rem;transition:transform .1s,border-color .15s,background .15s}
.btn:hover{border-color:var(--brand)}
.btn:active{transform:translateY(1px)}
.btn.solid{background:var(--brand-soft);border-color:var(--brand-soft)}
.btn.solid:hover{border-color:var(--brand)}
.btn.bright{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.small{padding:7px 12px;font-size:.84rem;border-radius:10px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn .arr{color:var(--brand)}
.btn.bright .arr{color:inherit}
.round{width:42px;height:42px;padding:0;border-radius:50%;flex:none}
.round svg{width:18px;height:18px}

/* panels */
.panel{border:1px solid var(--line);border-radius:28px;background:var(--panel);padding:clamp(20px,4vw,48px);margin-bottom:24px;position:relative;overflow:hidden}
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:center}
.hero h1{font-size:var(--fs-3xl);font-weight:800;letter-spacing:-.03em;line-height:.98}
.hero h1 span{display:block;color:var(--brand)}
.hero p{color:var(--muted);font-size:1.08rem;max-width:56ch;margin:20px 0 26px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

.next{background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 40%,transparent);border-radius:22px;padding:24px;position:relative;overflow:hidden;min-width:0}
.next::before{content:"";position:absolute;right:-60px;top:-70px;width:200px;height:200px;border-radius:50%;border:1px solid color-mix(in srgb,var(--brand) 30%,transparent)}
.next::after{content:"";position:absolute;right:-40px;bottom:-60px;width:150px;height:150px;border-radius:50%;background:var(--brand);opacity:.85}
.next-head{display:flex;gap:14px;align-items:center;position:relative;z-index:1}
.lvl{display:grid;place-items:center;width:52px;height:52px;border-radius:14px;background:var(--brand);color:var(--brand-ink);font-weight:800;font-size:1.05rem;flex:none}
.next h3{font-size:clamp(1.6rem,3vw,2.1rem);font-weight:800;margin:18px 0 18px;position:relative;z-index:1}
.steps{display:flex;align-items:center;gap:8px;position:relative;z-index:1;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:10px;border-radius:14px;padding:10px 14px;border:1px solid var(--line);flex:1 1 150px;min-width:0}
.step b{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--panel);font-size:.82rem;flex:none}
.step small{display:block;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;opacity:.8}
.step span{font-weight:700;font-size:.88rem}
.step.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.step.on b{background:var(--brand-ink);color:var(--brand)}
.step.done{border-color:var(--brand)}
.bar{height:5px;border-radius:9px;background:color-mix(in srgb,var(--ink) 15%,transparent);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:9px;transition:width .4s}
.next .bar{margin-top:20px;position:relative;z-index:1}
.next .meta{font-size:.82rem;margin-top:8px;position:relative;z-index:1;font-weight:600}

/* garden */
.garden{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:center}
.garden h2{font-size:clamp(2.2rem,5vw,3.6rem);font-weight:800;letter-spacing:-.03em}
.garden > div > p{color:var(--muted);font-size:1.05rem;max-width:52ch;margin:14px 0 24px}
.xp{border:1px solid var(--line);background:var(--panel-2);border-radius:22px;padding:20px}
.xp-head{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700}
.pct{border:1.5px solid var(--ink);border-radius:99px;padding:3px 10px;font-weight:800;font-size:.82rem;font-variant-numeric:tabular-nums}
.stages{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:22px;text-align:center}
.stages div{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);font-weight:700;opacity:.55}
.stages b{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;font-size:.78rem}
.stages .reached{opacity:1;color:var(--ink)}
.stages .reached b{background:var(--brand-soft)}
.stages .cur b{border:2px solid var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 20%,transparent)}
.plant{position:relative;display:flex;flex-direction:column;align-items:center}
.plant svg{width:100%;max-width:360px;height:auto}
.plant .stage-tag{position:absolute;right:6%;bottom:22%;background:var(--panel);border:1.5px solid var(--brand);border-radius:99px;padding:4px 12px;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.plant .total{font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-top:6px}

/* tracks */
.tracks h2{font-size:clamp(2rem,4.5vw,3.2rem);font-weight:800;margin-bottom:24px}
.track-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.track{border:1px solid var(--line);border-radius:24px;padding:28px;display:flex;flex-direction:column;gap:14px;text-decoration:none;color:inherit;background:var(--panel);transition:border-color .2s,transform .2s;min-width:0}
.track:hover{border-color:var(--brand);transform:translateY(-2px)}
.track .tag{align-self:flex-end;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:.74rem;font-weight:800}
.track h3{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:800}
.track p{color:var(--muted);margin:0}
.track .go{font-weight:800;font-size:.92rem;margin-top:auto;padding-top:10px}
.track .go span{color:var(--coral)}
.illo{display:flex;justify-content:center;align-items:center;gap:8px;min-height:130px;flex-wrap:wrap}
.chip-card{position:relative;border-radius:14px;padding:12px 16px;min-width:110px;border:1px solid var(--line);background:var(--panel-2)}
.chip-card small{display:block;font-size:.72rem;font-weight:800;letter-spacing:.06em;color:var(--muted)}
.chip-card b{font-size:1.1rem;font-weight:700}
.chip-card.t{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 35%,transparent)} .chip-card.t small{color:var(--brand)}
.chip-card.c{background:var(--coral-deep);border-color:color-mix(in srgb,var(--coral) 35%,transparent)} .chip-card.c small{color:var(--coral)}
.plus{color:var(--brand);font-weight:800}
.stack{position:relative;width:100%;max-width:400px;height:140px}
.stack .chip-card{position:absolute;top:18px}
.stack .l{left:0;transform:rotate(-5deg);width:40%;padding-right:8px}
.stack .r{right:0;transform:rotate(5deg);width:36%;text-align:right}
.stack .m{left:31%;right:26%;top:4px;z-index:1;box-shadow:0 18px 30px -18px rgba(0,0,0,.6)}
.stack .m b{font-size:1.7rem;letter-spacing:-.03em}

/* path pages */
.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:28px;align-items:start}
.side{border:1px solid var(--line);border-radius:24px;background:var(--panel);overflow:hidden;position:sticky;top:calc(80px + env(safe-area-inset-top,0px))}
.side-head{background:var(--brand-soft);padding:22px;position:relative;overflow:hidden}
.side-head::after{content:"";position:absolute;right:-50px;top:-60px;width:140px;height:140px;border-radius:50%;border:1px solid color-mix(in srgb,var(--brand) 35%,transparent)}
.side-head h2{font-size:1.7rem;font-weight:800;margin:6px 0 6px}
.side-list{display:grid;gap:8px;padding:12px;max-height:calc(100vh - 300px);overflow:auto}
.topic-search{position:relative;z-index:1;width:100%;margin-top:14px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 12px}
.topic-search:focus{outline:none;border-color:var(--brand)}
.topic{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:16px;border:1.5px solid transparent;background:var(--panel-2);cursor:pointer;text-align:left;width:100%}
.topic:hover{border-color:var(--line)}
.topic[aria-current="true"]{border-color:var(--brand)}
.sq{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;font-weight:800;color:var(--sq-ink)}
.sq.blue{background:var(--brand)} .sq.coral{background:var(--coral)} .sq.sand{background:var(--sand)} .sq.slate{background:var(--slate);color:var(--ink)}
.topic b{display:block;font-size:.95rem;line-height:1.3}
.topic small{color:var(--muted);font-size:.78rem}
.topic .bar{margin-top:6px;height:4px}
.topic .num{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--brand-soft);font-size:.72rem;font-weight:800}

.banner{display:flex;align-items:center;gap:18px;border:1px solid color-mix(in srgb,var(--brand) 45%,transparent);border-radius:24px;padding:18px;background:var(--panel);flex-wrap:wrap;margin-bottom:28px}
.banner .sq{width:96px;height:80px;border-radius:16px;font-size:.78rem;text-align:center;line-height:1.2;padding:6px}
.banner h2{font-size:clamp(1.5rem,3vw,2.2rem);font-weight:800}
.banner p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.banner > div{flex:1 1 220px;min-width:0}

.trail{display:grid;gap:0;padding:0 clamp(0px,3vw,40px)}
.level-sep{display:flex;align-items:center;gap:12px;margin:22px 0 10px;font-weight:800;color:var(--muted);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}
.level-sep::after{content:"";flex:1;border-top:1px dashed var(--line)}
.stop{position:relative;display:grid;grid-template-columns:auto 60px minmax(0,1fr);align-items:center;min-height:170px}
.stop.flip{grid-template-columns:minmax(0,1fr) 60px auto}
.stop.flip .node{order:3} .stop.flip .link{order:2;transform:scaleX(-1)} .stop.flip .card{order:1}
.stop:not(:last-child)::after{content:"";position:absolute;right:-28px;top:50%;height:100%;width:56px;border:2px dashed color-mix(in srgb,var(--brand) 45%,transparent);border-left:0;border-radius:0 60px 60px 0}
.stop.flip:not(:last-child)::after{right:auto;left:-28px;border-left:2px dashed color-mix(in srgb,var(--brand) 45%,transparent);border-right:0;border-radius:60px 0 0 60px}
.stop.no-link::after{display:none}
.node{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;align-content:center;border:7px solid var(--panel-2);background:var(--panel);position:relative;z-index:1}
.node b{font-size:2.3rem;font-weight:800;letter-spacing:-.025em;line-height:1}
.node small{font-size:.66rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-top:6px}
.node.open{border-color:var(--brand-soft);box-shadow:0 0 0 1px var(--brand) inset}
.node.open small{color:var(--coral)}
.node.done{border-color:var(--brand);background:var(--brand-soft)}
.node.done small{color:var(--brand)}
.node.locked{border-bottom-color:var(--ink);opacity:.8}
.link{height:2px;border-top:2px dashed var(--brand);position:relative;margin:0 6px}
.link::after{content:"";position:absolute;right:-6px;top:-7px;border:6px solid transparent;border-left:9px solid var(--brand)}
.card{border:1px solid var(--line);border-radius:22px;background:var(--panel);padding:22px 24px;min-width:0}
.card .eyebrow{color:var(--coral)}
.card h3{font-size:clamp(1.3rem,2.6vw,1.9rem);font-weight:800;margin:6px 0 8px}
.card.locked{opacity:.55}
.card .cta{background:none;border:0;padding:0;font-weight:800;cursor:pointer;font-size:.92rem}
.card .cta[disabled]{cursor:default;color:var(--muted);font-weight:700}
.score{font-size:.8rem;font-weight:700;color:var(--good);margin-left:8px}

.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-bottom:28px}
.word-item{border:1px solid var(--line);border-radius:16px;background:var(--panel-2);padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.word-item b{display:block}
.word-item .ipa{font-size:.95rem}
.word-item div{min-width:0}

/* lesson */
.lesson{max-width:820px;margin:0 auto}
.lesson-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.lesson-top h2{font-size:clamp(1.3rem,3vw,1.8rem);font-weight:800}
.lesson-top .steps{margin-left:auto}
.lesson-top .step{flex:0 0 auto;padding:6px 10px}
.lesson-top .step b{width:28px;height:28px}
.progress{margin-bottom:24px}

.flash{perspective:1600px;cursor:pointer;max-width:620px;margin:0 auto}
.flash-in{display:grid;transition:transform .55s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.flash.on .flash-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;padding:28px;min-height:320px;display:flex;flex-direction:column;gap:12px;border:1px solid color-mix(in srgb,var(--brand) 40%,transparent);background:var(--brand-soft)}
.face.back{transform:rotateY(180deg);background:var(--panel);border-color:var(--line)}
.face .top-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.big-word{font-size:clamp(2.6rem,9vw,4.4rem);font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:auto;overflow-wrap:anywhere}
.ipa{font-family:var(--f-phon);color:var(--muted);font-size:1.25rem}
.hint{font-size:.82rem;color:var(--muted);margin-top:auto}
.meaning{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:800;letter-spacing:-.03em;line-height:1.1}
.ctx{display:inline-flex;gap:10px;align-items:center;border-radius:12px;background:var(--coral-deep);padding:8px 12px;align-self:flex-start}
.ctx small{color:var(--coral);font-weight:800;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
.ex{font-family:var(--f-phon);font-style:italic;font-size:1.2rem;border-left:3px solid var(--brand);padding-left:14px;margin-top:auto}
.ex mark{background:none;color:var(--brand);font-weight:700;font-style:normal;font-family:var(--f-body);font-size:.95em}
.blank{display:inline-block;min-width:5em;border-bottom:2px solid var(--ink);color:transparent;font-style:normal}
.nav-row{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:620px;margin:20px auto 0;flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--brand);width:22px;border-radius:9px}
.dots i.seen{background:color-mix(in srgb,var(--brand) 50%,var(--line))}

.theory{display:grid;gap:22px}
.theory .intro{font-size:1.12rem;max-width:62ch}
.formula{border:1px solid var(--line);border-radius:20px;padding:16px 18px;background:var(--panel)}
.formula > small{font-weight:800;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.chips .chip-card{min-width:0;padding:8px 12px}
.chips .chip-card b{font-size:1rem}
.chips .chip-card.s{background:var(--panel-2)}
.notes{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.notes li{padding:12px 16px;border-radius:14px;background:var(--panel-2);border-left:3px solid var(--sand)}
.examples{display:grid;gap:10px}
.example{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:16px}
.example div{min-width:0}
.example b{display:block;font-weight:600;font-size:1.05rem}
.example small{color:var(--muted)}
.section-title{font-size:1.25rem;font-weight:800;letter-spacing:-.02em}

.q{border:1px solid var(--line);border-radius:24px;background:var(--panel);padding:clamp(20px,4vw,32px);display:grid;gap:12px}
.q .label{font-size:.74rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
.q .prompt{font-size:clamp(1.3rem,3.4vw,1.7rem);font-weight:700;letter-spacing:-.02em;line-height:1.3}
.q .prompt .gap{display:inline-block;min-width:3.5em;border-bottom:2.5px solid var(--brand);margin:0 4px}
.listen{width:96px;height:96px;border-radius:50%;background:var(--brand);color:var(--brand-ink);border:0;cursor:pointer;display:grid;place-items:center;margin:8px auto}
.listen svg{width:40px;height:40px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--panel);cursor:pointer;font-weight:600;min-width:0}
.opt:hover:not([disabled]){border-color:var(--brand)}
.opt .k{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--panel-2);font-size:.78rem;font-weight:800;flex:none}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--panel))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--panel))}
.opt[disabled]{cursor:default}
.spell{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.spell input{flex:1 1 240px;min-width:0;border:2px solid var(--line);border-radius:16px;background:var(--panel);padding:14px 16px;font-size:1.3rem;font-weight:700}
.spell input:focus{outline:none;border-color:var(--brand)}
.spell input.right{border-color:var(--good)} .spell input.wrong{border-color:var(--bad)}
.shape{font-weight:800;letter-spacing:.3em;color:var(--muted)}
.fb{margin-top:16px;border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.fb.ok{background:color-mix(in srgb,var(--good) 14%,transparent)}
.fb.no{background:color-mix(in srgb,var(--bad) 14%,transparent)}
.fb div{flex:1 1 240px;min-width:0}
.fb b{display:block}
.fb.ok b{color:var(--good)} .fb.no b{color:var(--bad)}
.fb small{color:var(--muted)}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;font-size:.72rem;font-weight:700}

.result{text-align:center;padding:clamp(24px,5vw,48px)}
.result h2{font-size:clamp(2rem,5vw,3rem);font-weight:800}
.result .big{font-size:clamp(3.4rem,10vw,5.5rem);font-weight:800;letter-spacing:-.03em;line-height:1;margin:18px 0 6px;font-variant-numeric:tabular-nums}
.result .row{justify-content:center;margin-top:24px}
.xp-earn{display:inline-flex;gap:8px;align-items:center;border-radius:99px;padding:6px 14px;background:var(--brand-soft);font-weight:800;margin-top:10px}
.missed{display:grid;gap:8px;text-align:left;max-width:560px;margin:24px auto 0}
.missed div{border-radius:14px;background:var(--panel-2);padding:10px 14px;font-size:.92rem}
.missed b{color:var(--coral)}

.empty{text-align:center;padding:48px 20px}
.empty h2{font-size:2rem;font-weight:800;margin-bottom:8px}

/* listening & speaking */
.ltabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.ltabs button{border:1.5px solid var(--line);background:var(--panel);border-radius:99px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:.88rem}
.ltabs button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.ltabs b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--panel-2);color:var(--ink);font-size:.7rem;margin-right:6px}
.player{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.player .pill-group button{width:auto;padding:0 10px;border-radius:99px}
.para{font-size:1.18rem;line-height:1.9;border:1px solid var(--line);border-radius:24px;background:var(--panel);padding:clamp(18px,4vw,30px);transition:filter .3s}
.para.blurred{filter:blur(7px);user-select:none}
.sent{border-radius:6px;padding:1px 0;transition:background .2s}
.sent[data-act]{cursor:pointer}
.sent[data-act]:hover{background:color-mix(in srgb,var(--brand) 12%,transparent)}
.sent.now{background:color-mix(in srgb,var(--sand) 35%,transparent)}
.para mark{background:none;color:var(--brand);font-weight:700}
.gap-in{font:inherit;font-weight:700;border:0;border-bottom:2px solid var(--brand);background:color-mix(in srgb,var(--brand) 9%,transparent);border-radius:6px 6px 0 0;padding:0 6px;max-width:100%;line-height:1.4}
.gap-in:focus{outline:none;background:color-mix(in srgb,var(--brand) 20%,transparent)}
.gap-in.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,transparent)}
.gap-in.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent)}
.fix{font-size:.8em;color:var(--good);font-weight:800;margin:0 4px}
.tip{font-size:.86rem;color:var(--muted);margin:12px 2px 0}
.shadow-text{font-size:clamp(1.3rem,3.6vw,1.75rem);font-weight:600;line-height:1.45;letter-spacing:-.01em}
.w-ok{color:var(--good)} .w-miss{color:var(--bad);text-decoration:underline wavy;text-underline-offset:4px}
.kws{display:flex;flex-wrap:wrap;gap:8px}
.kw{border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.kw small{font-weight:600;color:var(--muted)}
.kw[aria-pressed="true"]{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--panel))}
.kw[aria-pressed="true"]::before{content:"✓";color:var(--good)}
.clock{font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.mic-btn svg{width:18px;height:18px}
.rec-on{background:var(--coral)!important;border-color:var(--coral)!important;color:var(--sq-ink)!important}
.lesson-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px dashed var(--line)}
/* story studio */
.studio{display:grid;grid-template-columns:340px minmax(0,1fr);gap:28px;align-items:start}
.story-controls{display:grid;gap:14px;padding:16px}
.story-controls label{display:grid;gap:6px;font-weight:700;font-size:.85rem}
.story-controls select,.story-title{border:1.5px solid var(--line);background:var(--panel-2);border-radius:12px;padding:10px 12px;font-weight:600;width:100%;min-width:0}
.story-title{background:var(--panel);font-size:1.15rem;font-weight:800}
.story-text{width:100%;min-height:260px;resize:vertical;border:1.5px solid var(--line);background:var(--panel);border-radius:16px;padding:14px 16px;font:inherit;font-size:1.08rem;line-height:1.75;color:var(--ink)}
.story-text:focus,.story-title:focus,.story-controls select:focus{outline:none;border-color:var(--brand)}
.sw[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.sw[aria-pressed="true"]::before{content:none}
.sw[data-used="true"]{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--panel))}
.sw[data-used="true"]::before{content:"✓";color:var(--good)}
.kws.compact .kw{padding:6px 10px;font-size:.88rem}
.ai-box{margin-top:22px}
.ai-score{display:inline-grid;place-items:center;min-width:64px;height:64px;border-radius:18px;background:var(--brand);color:var(--brand-ink);font-size:1.6rem;font-weight:800}
.fix-row{display:grid;gap:2px;padding:10px 14px;border-radius:14px;background:var(--panel-2)}
.fix-row s{color:var(--bad)} .fix-row b{color:var(--good)} .fix-row small{color:var(--muted)}
.story-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.story-card{border:1px solid var(--line);border-radius:16px;background:var(--panel-2);padding:14px;display:grid;gap:6px;min-width:0}
.story-card p{margin:0;color:var(--muted);font-size:.88rem;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
details.trans{border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--panel-2)}
details.trans summary{cursor:pointer;font-weight:700}
.story-track{grid-column:1/-1;flex-direction:row;align-items:center;flex-wrap:wrap}
.story-track > div{flex:1 1 280px;min-width:0}
@media (max-width:900px){ .studio{grid-template-columns:1fr} }
.pill-group.wide button{width:auto;padding:0 14px;border-radius:99px;font-size:.84rem}
.cta2{background:none;border:0;padding:0;margin-left:14px;font-weight:700;color:var(--brand);cursor:pointer;font-size:.9rem}
.lp-badge{display:inline-block;font-size:.72rem;font-weight:800;color:var(--brand);margin-left:10px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--brand);color:var(--brand-ink);font-weight:800;padding:10px 18px;border-radius:12px;transition:all .25s;z-index:30;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  .hero,.garden{grid-template-columns:1fr}
  .layout{grid-template-columns:1fr}
  .side{position:static}
  .side-list{max-height:none;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  .track-grid{grid-template-columns:1fr}
  .nav{order:3;width:100%;margin:0;justify-content:center}
}
@media (max-width:640px){
  .stop,.stop.flip{grid-template-columns:auto minmax(0,1fr);gap:14px;min-height:0;padding-bottom:18px}
  .stop.flip .node{order:0} .stop.flip .card{order:1}
  .link{display:none}
  .stop::after,.stop.flip::after{display:none}
  .stop:not(:last-child)::before{content:"";position:absolute;left:39px;top:80px;bottom:0;border-left:2px dashed color-mix(in srgb,var(--brand) 45%,transparent)}
  .node{width:80px;height:80px;border-width:5px}
  .node b{font-size:1.5rem}
  .opts{grid-template-columns:1fr}
  .stages{grid-template-columns:repeat(3,1fr);row-gap:14px}
  .lesson-top .steps{margin-left:0}
  .tools .theme-btn span{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

<script>
/* ================= CONTENT ================= */
const GRAMMAR = [
 {id:"a1-be", lv:"A1", t:"To be & subject pronouns", vi:"Động từ to be và đại từ chủ ngữ",
  intro:"To be (am / is / are) dùng để nói ai đó là ai, ở đâu, như thế nào. Dạng của to be thay đổi theo chủ ngữ.",
  f:[{l:"Khẳng định",p:[["S","Chủ ngữ"],["am / is / are","to be"],["N / Adj","Bổ ngữ"]]},{l:"Phủ định",p:[["S","Chủ ngữ"],["am / is / are + not","to be"],["N / Adj","Bổ ngữ"]]},{l:"Nghi vấn",p:[["Am / Is / Are","to be"],["S","Chủ ngữ"],["N / Adj ?","Bổ ngữ"]]}],
  notes:["I → am · he / she / it → is · you / we / they → are","Dạng viết tắt: I'm, she's, they're, isn't, aren't"],
  ex:[["She is a nurse.","Cô ấy là y tá."],["We aren't tired.","Chúng tôi không mệt."],["Are they from Da Nang?","Họ đến từ Đà Nẵng phải không?"]],
  q:[{q:"My brother ___ a doctor.",o:["am","is","are","be"],a:1,why:"My brother = he → is."},
     {q:"___ you ready?",o:["Is","Am","Are","Be"],a:2,why:"Chủ ngữ you đi với are."},
     {q:"I ___ not hungry.",o:["is","are","am","be"],a:2,why:"Chủ ngữ I luôn đi với am."},
     {q:"Lan and Minh ___ classmates.",o:["is","am","are","be"],a:2,why:"Hai người = they → are."},
     {q:"Đại từ nào thay cho “my sister”?",o:["he","she","it","they"],a:1,why:"My sister là nữ, số ít → she."}]},
 {id:"a1-ps", lv:"A1", t:"Present simple", vi:"Thì hiện tại đơn",
  intro:"Thì hiện tại đơn diễn tả thói quen, sự thật hiển nhiên và lịch trình cố định.",
  f:[{l:"Khẳng định",p:[["S","Chủ ngữ"],["V / V-s/es","Động từ"],["O","Tân ngữ"]]},{l:"Phủ định",p:[["S","Chủ ngữ"],["do / does + not","Trợ động từ"],["V","Động từ"]]},{l:"Nghi vấn",p:[["Do / Does","Trợ động từ"],["S","Chủ ngữ"],["V ?","Động từ"]]}],
  notes:["He / she / it: thêm -s hoặc -es vào động từ (works, watches, goes).","Dấu hiệu: always, usually, often, sometimes, every day."],
  ex:[["She works in a bank.","Cô ấy làm việc ở ngân hàng."],["Water boils at 100°C.","Nước sôi ở 100°C."],["Do you drink coffee?","Bạn có uống cà phê không?"]],
  q:[{q:"He ___ to school by bus.",o:["go","goes","going","gone"],a:1,why:"He → động từ thêm -es: goes."},
     {q:"They ___ like spicy food.",o:["doesn't","don't","isn't","aren't"],a:1,why:"They dùng trợ động từ do → don't."},
     {q:"___ she speak Japanese?",o:["Do","Is","Does","Are"],a:2,why:"She → Does + V nguyên mẫu."},
     {q:"The sun ___ in the east.",o:["rise","rises","rising","rose"],a:1,why:"Sự thật hiển nhiên → hiện tại đơn, the sun = it → rises."},
     {q:"My dad usually ___ the dishes.",o:["wash","washs","washes","washing"],a:2,why:"Động từ tận cùng -sh thêm -es."}]},
 {id:"a2-past", lv:"A2", t:"Past simple", vi:"Thì quá khứ đơn",
  intro:"Thì quá khứ đơn diễn tả hành động đã xảy ra và kết thúc tại một thời điểm xác định trong quá khứ.",
  f:[{l:"Khẳng định",p:[["S","Chủ ngữ"],["V2 / V-ed","Động từ"]]},{l:"Phủ định",p:[["S","Chủ ngữ"],["did not","Trợ động từ"],["V","Động từ"]]},{l:"Nghi vấn",p:[["Did","Trợ động từ"],["S","Chủ ngữ"],["V ?","Động từ"]]}],
  notes:["Động từ bất quy tắc cần học thuộc: go → went, see → saw, buy → bought.","Dấu hiệu: yesterday, last week, two days ago, in 2010."],
  ex:[["We visited Hue last summer.","Chúng tôi đã đến Huế mùa hè năm ngoái."],["I didn't see him yesterday.","Hôm qua tôi không gặp anh ấy."],["Did you finish your homework?","Bạn đã làm xong bài tập chưa?"]],
  q:[{q:"She ___ a new phone last week.",o:["buy","buys","bought","buyed"],a:2,why:"Buy là động từ bất quy tắc: buy → bought."},
     {q:"We ___ go out last night.",o:["don't","didn't","weren't","doesn't"],a:1,why:"Phủ định quá khứ đơn: didn't + V."},
     {q:"___ they enjoy the film?",o:["Do","Were","Did","Was"],a:2,why:"Câu hỏi quá khứ đơn: Did + S + V?"},
     {q:"I ___ him two days ago.",o:["meet","met","meeted","have met"],a:1,why:"“ago” là dấu hiệu quá khứ đơn; meet → met."},
     {q:"He ___ at home yesterday.",o:["was","were","is","did"],a:0,why:"To be ở quá khứ: he → was."}]},
 {id:"a2-comp", lv:"A2", t:"Comparatives & superlatives", vi:"So sánh hơn và so sánh nhất",
  intro:"Dùng so sánh hơn để so sánh hai đối tượng, so sánh nhất để chọn ra đối tượng nổi bật nhất trong một nhóm.",
  f:[{l:"So sánh hơn",p:[["Adj-er / more + Adj","Tính từ"],["than","Từ nối"],["N","Đối tượng"]]},{l:"So sánh nhất",p:[["the","Mạo từ"],["Adj-est / most + Adj","Tính từ"]]}],
  notes:["Tính từ ngắn: tall → taller → the tallest.","Tính từ dài: expensive → more expensive → the most expensive.","Bất quy tắc: good → better → best; bad → worse → worst."],
  ex:[["Hanoi is bigger than Hue.","Hà Nội lớn hơn Huế."],["This is the most interesting book I've read.","Đây là cuốn sách thú vị nhất tôi từng đọc."],["Her English is better than mine.","Tiếng Anh của cô ấy giỏi hơn của tôi."]],
  q:[{q:"My room is ___ than yours.",o:["small","smaller","smallest","more small"],a:1,why:"Tính từ ngắn + -er + than."},
     {q:"It's the ___ day of the year.",o:["hot","hotter","hottest","most hot"],a:2,why:"So sánh nhất của hot là the hottest (gấp đôi t)."},
     {q:"This test was ___ than the last one.",o:["difficult","more difficult","most difficult","difficulter"],a:1,why:"Tính từ dài: more + adj + than."},
     {q:"She is the ___ student in our class.",o:["good","better","best","most good"],a:2,why:"Good → better → best."},
     {q:"Today is ___ than yesterday.",o:["bad","worse","worst","badder"],a:1,why:"Bad → worse → worst."}]},
 {id:"b1-pp", lv:"B1", t:"Present perfect", vi:"Thì hiện tại hoàn thành",
  intro:"Thì hiện tại hoàn thành nối quá khứ với hiện tại: trải nghiệm, hành động còn tiếp diễn, hoặc kết quả còn ảnh hưởng đến bây giờ.",
  f:[{l:"Khẳng định",p:[["S","Chủ ngữ"],["have / has","Trợ động từ"],["V3 / V-ed","Phân từ II"]]},{l:"Nghi vấn",p:[["Have / Has","Trợ động từ"],["S","Chủ ngữ"],["V3 ?","Phân từ II"]]}],
  notes:["for + khoảng thời gian (for three years); since + mốc thời gian (since 2020).","Không dùng với thời điểm xác định như yesterday, last year."],
  ex:[["I have lived here since 2019.","Tôi đã sống ở đây từ năm 2019."],["She has never been to Japan.","Cô ấy chưa bao giờ đến Nhật."],["Have you finished the report yet?","Bạn đã viết xong báo cáo chưa?"]],
  q:[{q:"I ___ this film three times.",o:["see","saw","have seen","has seen"],a:2,why:"Trải nghiệm tính đến hiện tại → have seen."},
     {q:"They have worked here ___ 2015.",o:["for","since","ago","in"],a:1,why:"2015 là mốc thời gian → since."},
     {q:"She ___ her keys, so she can't get in.",o:["lost","has lost","have lost","loses"],a:1,why:"Kết quả còn ảnh hưởng hiện tại → has lost."},
     {q:"We have known each other ___ ten years.",o:["since","for","ago","during"],a:1,why:"Ten years là khoảng thời gian → for."},
     {q:"I ___ to Paris last year.",o:["have been","went","have gone","go"],a:1,why:"“last year” là thời điểm xác định → quá khứ đơn."}]},
 {id:"b1-cond", lv:"B1", t:"First & second conditionals", vi:"Câu điều kiện loại 1 và 2",
  intro:"Loại 1 nói về điều có thể xảy ra ở hiện tại hoặc tương lai. Loại 2 nói về điều không có thật hoặc khó xảy ra ở hiện tại.",
  f:[{l:"Loại 1",p:[["If + S + V(s/es)","Mệnh đề If"],["S + will + V","Mệnh đề chính"]]},{l:"Loại 2",p:[["If + S + V2 / were","Mệnh đề If"],["S + would + V","Mệnh đề chính"]]}],
  notes:["Loại 2 dùng were cho mọi chủ ngữ: If I were you…","Không dùng will trong mệnh đề If."],
  ex:[["If it rains, we will stay at home.","Nếu trời mưa, chúng tôi sẽ ở nhà."],["If I had more time, I would learn Korean.","Nếu có nhiều thời gian hơn, tôi sẽ học tiếng Hàn."],["If I were you, I would apologise.","Nếu tôi là bạn, tôi sẽ xin lỗi."]],
  q:[{q:"If she ___ hard, she will pass.",o:["study","studies","studied","would study"],a:1,why:"Loại 1: mệnh đề If dùng hiện tại đơn."},
     {q:"If I ___ rich, I would travel the world.",o:["am","was being","were","will be"],a:2,why:"Loại 2 dùng were cho mọi chủ ngữ."},
     {q:"If we leave now, we ___ the train.",o:["catch","will catch","would catch","caught"],a:1,why:"Loại 1: mệnh đề chính dùng will + V."},
     {q:"What ___ you do if you lost your phone?",o:["will","would","did","do"],a:1,why:"Lost (V2) → loại 2 → would."},
     {q:"If he ___ my number, he would call me.",o:["knows","knew","will know","has known"],a:1,why:"Loại 2: If + V2."}]},
 {id:"b2-pass", lv:"B2", t:"The passive voice", vi:"Câu bị động",
  intro:"Câu bị động dùng khi hành động hoặc đối tượng chịu tác động quan trọng hơn người thực hiện.",
  f:[{l:"Công thức chung",p:[["S","Chủ ngữ"],["be","Chia theo thì"],["V3","Phân từ II"],["(by O)","Tác nhân"]]},{l:"Ví dụ theo thì",s:true,p:[["is / are + V3","Hiện tại đơn"],["was / were + V3","Quá khứ đơn"],["will be + V3","Tương lai"],["is being + V3","Tiếp diễn"]]}],
  notes:["Chỉ thêm by + O khi người thực hiện là thông tin cần thiết."],
  ex:[["English is spoken in many countries.","Tiếng Anh được nói ở nhiều quốc gia."],["The bridge was built in 1902.","Cây cầu được xây năm 1902."],["The results will be announced tomorrow.","Kết quả sẽ được công bố vào ngày mai."]],
  q:[{q:"The letters ___ every morning.",o:["deliver","are delivered","delivered","are delivering"],a:1,why:"Thư được giao → bị động hiện tại đơn: are + V3."},
     {q:"This house ___ in 1990.",o:["built","was built","is built","has build"],a:1,why:"Năm 1990 → quá khứ: was + V3."},
     {q:"The winners ___ next week.",o:["will announce","will be announced","are announcing","announced"],a:1,why:"Tương lai bị động: will be + V3."},
     {q:"Chọn câu bị động của: “They cleaned the room.”",o:["The room was cleaned.","The room is cleaned.","The room cleaned.","The room has cleaning."],a:0,why:"Cleaned là quá khứ → was cleaned."},
     {q:"A new hospital ___ at the moment.",o:["is being built","is building","builds","was build"],a:0,why:"Hiện tại tiếp diễn bị động: is being + V3."}]},
 {id:"b2-rel", lv:"B2", t:"Relative clauses", vi:"Mệnh đề quan hệ",
  intro:"Mệnh đề quan hệ bổ sung thông tin cho danh từ đứng trước, giúp nối hai câu thành một.",
  f:[{l:"Đại từ quan hệ",s:true,p:[["who","Người"],["which","Vật"],["that","Người / vật"],["whose","Sở hữu"],["where","Nơi chốn"]]}],
  notes:["Mệnh đề không xác định (có dấu phẩy) không dùng that.","Có thể lược bỏ who / which / that khi nó làm tân ngữ: The book (that) I bought…"],
  ex:[["The woman who lives next door is a teacher.","Người phụ nữ sống cạnh nhà là giáo viên."],["Da Lat, which is famous for flowers, is cool all year.","Đà Lạt, nơi nổi tiếng về hoa, mát mẻ quanh năm."],["That's the café where we first met.","Đó là quán cà phê nơi chúng tôi gặp nhau lần đầu."]],
  q:[{q:"The man ___ called you is my uncle.",o:["which","who","whose","where"],a:1,why:"Danh từ chỉ người làm chủ ngữ → who."},
     {q:"This is the village ___ I grew up.",o:["which","who","where","whose"],a:2,why:"Nơi chốn → where."},
     {q:"I have a friend ___ father is a pilot.",o:["who","whose","which","that"],a:1,why:"Sở hữu (bố của bạn ấy) → whose."},
     {q:"My phone, ___ I bought last month, is already broken.",o:["that","which","who","where"],a:1,why:"Sau dấu phẩy không dùng that."},
     {q:"The film ___ we watched was boring.",o:["who","where","that","whose"],a:2,why:"Vật, mệnh đề xác định → that hoặc which."}]},
 {id:"c1-inv", lv:"C1", t:"Inversion for emphasis", vi:"Đảo ngữ",
  intro:"Đảo ngữ đưa trợ động từ lên trước chủ ngữ để nhấn mạnh. Cấu trúc này rất có giá trị trong IELTS Writing và văn phong trang trọng.",
  f:[{l:"Trạng từ phủ định",p:[["Never / Rarely / Seldom","Trạng từ"],["Aux","Trợ động từ"],["S + V","Chủ ngữ + động từ"]]},{l:"Not only",p:[["Not only + Aux + S + V","Vế 1"],["but S also V","Vế 2"]]},{l:"No sooner",p:[["No sooner + had + S + V3","Vế 1"],["than + S + V2","Vế 2"]]}],
  notes:["Trợ động từ đứng trước chủ ngữ giống như trong câu hỏi.","Under no circumstances / At no time cũng dùng đảo ngữ."],
  ex:[["Never have I seen such a beautiful beach.","Tôi chưa bao giờ thấy bãi biển nào đẹp như vậy."],["Not only does she sing, but she also writes songs.","Cô ấy không chỉ hát mà còn sáng tác."],["No sooner had we arrived than it started to rain.","Chúng tôi vừa đến thì trời đổ mưa."]],
  q:[{q:"Rarely ___ such dedication.",o:["I have seen","have I seen","I saw","seen I have"],a:1,why:"Rarely đứng đầu → đảo trợ động từ: have I seen."},
     {q:"Not only ___ late, but he also forgot the tickets.",o:["he was","was he","he is","did he was"],a:1,why:"Not only + to be + S."},
     {q:"No sooner ___ the house than the phone rang.",o:["I had left","had I left","I left","did I leave"],a:1,why:"No sooner + had + S + V3."},
     {q:"Seldom ___ to work by car.",o:["she goes","does she go","she does go","goes she"],a:1,why:"Hiện tại đơn → đảo does + S + V."},
     {q:"Under no circumstances ___ open this door.",o:["you should","should you","you must","must you to"],a:1,why:"Under no circumstances + Aux + S + V."}]},
 {id:"c1-mixed", lv:"C1", t:"Mixed conditionals", vi:"Câu điều kiện hỗn hợp",
  intro:"Câu điều kiện hỗn hợp kết hợp điều kiện và kết quả ở hai thời điểm khác nhau.",
  f:[{l:"Quá khứ → hiện tại",p:[["If + S + had + V3","Điều kiện quá khứ"],["S + would + V","Kết quả hiện tại"]]},{l:"Hiện tại → quá khứ",p:[["If + S + V2 / were","Điều kiện hiện tại"],["S + would have + V3","Kết quả quá khứ"]]}],
  notes:["Xác định thời điểm của từng vế trước khi chọn thì."],
  ex:[["If I had taken that job, I would be living in Singapore now.","Nếu tôi đã nhận công việc đó, giờ tôi đang sống ở Singapore."],["If she weren't so shy, she would have spoken at the meeting.","Nếu cô ấy không nhút nhát, cô ấy đã phát biểu trong cuộc họp."]],
  q:[{q:"If I ___ harder at school, I would have a better job now.",o:["studied","had studied","study","would study"],a:1,why:"Điều kiện trong quá khứ → had + V3."},
     {q:"If he weren't afraid of flying, he ___ to the conference last week.",o:["would go","would have gone","went","had gone"],a:1,why:"Kết quả trong quá khứ → would have + V3."},
     {q:"If we had booked earlier, we ___ in a nicer hotel now.",o:["would be staying","will stay","had stayed","stay"],a:0,why:"Kết quả ở hiện tại (now) → would + V."},
     {q:"If I ___ you, I wouldn't have said that.",o:["am","were","had","was being"],a:1,why:"Điều kiện hiện tại không có thật → were."},
     {q:"Câu nào là câu điều kiện hỗn hợp?",o:["If it rains, I'll stay home.","If I had saved money, I would be rich now.","If I were taller, I would play basketball.","If you heat ice, it melts."],a:1,why:"Vế If ở quá khứ, vế chính ở hiện tại."}]},
 {id:"c2-subj", lv:"C2", t:"The subjunctive", vi:"Thức giả định",
  intro:"Thức giả định diễn tả yêu cầu, đề nghị, mong ước hoặc điều trái với thực tế, thường gặp trong văn phong trang trọng.",
  f:[{l:"Sau động từ đề nghị",p:[["S + suggest / insist / recommend","Động từ"],["that + S","Mệnh đề"],["V (nguyên mẫu)","Động từ"]]},{l:"Sau tính từ",p:[["It is essential / vital","Tính từ"],["that + S","Mệnh đề"],["V (nguyên mẫu)","Động từ"]]},{l:"Mong ước hiện tại",p:[["S + wish / If only","Mong ước"],["S + V2","Quá khứ"]]}],
  notes:["Động từ trong mệnh đề that giữ dạng nguyên mẫu cho mọi chủ ngữ: he go, không phải he goes.","Phủ định: that he not be late."],
  ex:[["The doctor recommended that he rest for a week.","Bác sĩ khuyên anh ấy nghỉ ngơi một tuần."],["It is vital that every student attend the briefing.","Mọi sinh viên bắt buộc phải tham dự buổi hướng dẫn."],["I wish I knew the answer.","Ước gì tôi biết câu trả lời."]],
  q:[{q:"She insisted that he ___ immediately.",o:["leaves","leave","left","will leave"],a:1,why:"Sau insist that → V nguyên mẫu."},
     {q:"It is essential that the report ___ finished by Friday.",o:["is","be","was","will be"],a:1,why:"Sau It is essential that → be."},
     {q:"I wish I ___ how to swim.",o:["know","knew","have known","will know"],a:1,why:"Mong ước ở hiện tại → V2."},
     {q:"They recommended that she ___ late again.",o:["not be","isn't","wasn't","won't be"],a:0,why:"Phủ định giả định: not + V nguyên mẫu."},
     {q:"If only I ___ more time now.",o:["have","had","will have","having"],a:1,why:"If only + V2 cho mong ước ở hiện tại."}]},
 {id:"c2-cleft", lv:"C2", t:"Cleft sentences", vi:"Câu chẻ",
  intro:"Câu chẻ tách câu thành hai phần để nhấn mạnh một thông tin cụ thể.",
  f:[{l:"It-cleft",p:[["It is / was","Mở đầu"],["phần nhấn mạnh","Trọng tâm"],["that / who + mệnh đề","Phần còn lại"]]},{l:"What-cleft",p:[["What + S + V","Mệnh đề"],["is / was","to be"],["phần nhấn mạnh","Trọng tâm"]]}],
  notes:["Nhấn mạnh người có thể dùng who hoặc that; nhấn mạnh vật, thời gian, nơi chốn dùng that."],
  ex:[["It was Nam who broke the window.","Chính Nam là người làm vỡ cửa sổ."],["What I need is a long holiday.","Điều tôi cần là một kỳ nghỉ dài."],["It is in Hoi An that we first met.","Chính ở Hội An chúng tôi gặp nhau lần đầu."]],
  q:[{q:"It was my sister ___ found the wallet.",o:["which","who","what","where"],a:1,why:"Nhấn mạnh người → who."},
     {q:"___ I really want is some peace and quiet.",o:["That","Which","What","It"],a:2,why:"What-cleft: What + S + V + is…"},
     {q:"It was in 2015 ___ they got married.",o:["when","that","which","who"],a:1,why:"It-cleft luôn dùng that cho thời gian."},
     {q:"Nhấn mạnh “the price”: “The price surprised me.”",o:["It was the price that surprised me.","It was surprised me the price.","What surprised the price me.","The price it was surprised me."],a:0,why:"It was + phần nhấn mạnh + that + mệnh đề."},
     {q:"___ was the noise that woke me up.",o:["What","It","That","This"],a:1,why:"It-cleft bắt đầu bằng It is / It was."}]}
