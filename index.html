function paraHTML(text, ws, mode){
  const sents = splitSent(text), ranges = wordRanges(text, ws);
  let pos = 0, out = "";
  sents.forEach((s, k) => {
    const st = text.indexOf(s, pos), en = st + s.length; let inner = "", c = st;
    ranges.filter(r => r.i >= st && r.i < en).forEach(r => {
      const n = ranges.indexOf(r), word = text.substr(r.i, r.len);
      inner += esc(text.slice(c, r.i));
      if(mode === "gap"){
        const res = V.dictRes ? (V.dictRes[n] ? "right" : "wrong") : "";
        inner += `<input class="gap-in ${res}" id="gap-${n}" data-n="${n}" value="${esc((V.dict||{})[n]||"")}" style="width:${Math.max(4, word.length*.62+1.4).toFixed(1)}em" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Từ còn thiếu số ${n+1}" ${V.dictRes?"readonly":""}>${V.dictRes && !V.dictRes[n] ? `<span class="fix">${esc(word)}</span>` : ""}`;
      } else inner += `<mark>${esc(word)}</mark>`;
      c = r.i + r.len;
    });
    inner += esc(text.slice(c, en));
    out += esc(text.slice(pos, st)) + (mode === "gap" ? `<span class="sent" data-i="${k}">${inner}</span>` : `<span class="sent" data-act="play-sent" data-i="${k}" title="Nhấn để nghe câu này">${inner}</span>`);
    pos = en;
  });
  return out + esc(text.slice(pos));
}

function answer(ok, pickIdx){

  const refKey = JSON.stringify(q.ref);
  if(ok){ V.correct++; addXp(V.name==="practice"?3:5); if(V.name==="practice") S.review = S.review.filter(r => JSON.stringify(r)!==refKey); }
  else { V.wrong.push(q); if(!S.review.some(r => JSON.stringify(r)===refKey)) S.review.push(q.ref); }
  persist(); render();
  if(q.w && (ok || q.type!=="mc")) speak(q.w.w);
}
function resultView(){
  const n = V.qs.length, pct = V.correct/n, m = lessonMeta();
  const pass = pct >= PASS;
  let nextBtn = "";
  if(V.name!=="practice" && pass){
    if(V.kind==="g" && V.idx+1 < GRAMMAR.length) nextBtn = `<button class="btn bright" data-act="open-g" data-i="${V.idx+1}">Học bài tiếp theo <span class="arr">→</span></button>`;
    if(V.kind==="v"){ const t=topicById(V.topic); if(V.l+1 < t.lessons.length) nextBtn = `<button class="btn bright" data-act="open-v" data-t="${t.id}" data-l="${V.l+1}">Học bài tiếp theo <span class="arr">→</span></button>`;
      else { const ti=TOPICS.indexOf(t); if(TOPICS[ti+1]) nextBtn = `<button class="btn bright" data-act="open-v" data-t="${TOPICS[ti+1].id}" data-l="0">Sang chủ đề tiếp theo <span class="arr">→</span></button>`; } }
  }
  const title = V.name==="practice" ? (V.wrong.length ? "Tiếp tục cố gắng" : "Đã ôn xong") : pass ? (pct===1?"Hoàn hảo!":"Bạn đã qua chặng này") : "Gần được rồi";
  const msg = V.name==="practice" ? `${V.correct} mục đã được xóa khỏi sổ ôn tập.` : pass ? (V.bonus?`Bài học đã hoàn thành và bạn nhận thêm ${V.bonus} XP thưởng.`:"Bài học đã hoàn thành.") : `Cần đạt ${Math.round(PASS*100)}% để mở chặng tiếp theo. Xem lại phần học rồi thử lại nhé.`;
  return `<div class="panel result">
    <h2>${title}</h2><div class="big">${V.correct}/${n}</div><div class="muted">${Math.round(pct*100)}% câu trả lời đúng</div>
    <div class="xp-earn">+${V.earned} XP</div>
    <p class="muted" style="max-width:48ch;margin:16px auto 0">${msg}</p>
    ${V.wrong.length?`<div class="missed">${V.wrong.map(q=>`<div><b>${esc(q.w?q.w.w:q.answer)}</b>${q.w?` · ${esc(q.w.vi)}`:q.why?` · ${esc(q.why)}`:""}</div>`).join("")}</div>`:""}
    <div class="row">${nextBtn}${V.name==="practice" ? (S.review.length?`<button class="btn solid" data-act="practice">Ôn tiếp ${S.review.length} mục</button>`:"") : `<button class="btn ${pass?"":"bright"}" data-act="retry">Làm lại kiểm tra</button><button class="btn" data-act="relearn">Xem lại phần học</button>`}<a class="btn" href="#${m.back}">Về lộ trình</a></div>
  </div>`;
}
function finishTest(){
  const n = V.qs.length, pct = V.correct/n;
  V.earned = V.correct * (V.name==="practice"?3:5); V.bonus = 0;
  if(V.name!=="practice"){
    const k = lessonMeta().key, wasDone = isDone(k);
    S.done[k] = Math.max(S.done[k]||0, pct);
    if(pct >= PASS && !wasDone){ V.bonus = 30; addXp(30); V.earned += 30; }
    persist();
  }
  V.phase = "result"; render(); window.scrollTo(0,0);
}
function startPractice(){
  const items = shuffle(S.review).slice(0,10);
  const qs = items.map(r=>{
    if(r.k==="g"){ const g=GRAMMAR.find(x=>x.id===r.id); return g ? grammarQ(g,r.qi) : null; }
    const t=topicById(r.t), w=t.lessons[r.l]?.find(x=>x.w===r.w); if(!w) return null;
    return makeVQ(shuffle(["meaning","reverse","spell"])[0], w, shuffle(t.lessons.flat().filter(x=>x!==w)).slice(0,3), r);
  }).filter(Boolean);
  if(!qs.length){ S.review=[]; persist(); return go("review"); }
  V = {name:"practice", phase:"test", qs, qi:0, answered:false, pick:null, correct:0, wrong:[], val:""};
  render(); window.scrollTo(0,0); autoSpeak();
}

/* ================= EVENTS ================= */
document.addEventListener("click", e => {
  const ln = e.target.closest('a[href^="#"]');
  if(ln && ln.getAttribute("href").slice(1) === location.hash.slice(1)){ e.preventDefault(); return fromHash(); }
  const lg = e.target.closest("button[data-lang]");
  if(lg){ S.lang = lg.dataset.lang; store.set("chang.lang", S.lang); return render(); }
  const sz = e.target.closest("button[data-size]");
  if(sz){ S.size = sz.dataset.size; store.set("chang.size", S.size); return render(); }
  if(e.target.closest("#theme-btn")){ S.theme = {system:"light", light:"dark", dark:"system"}[S.theme]; store.set("chang.theme",S.theme); applyTheme(); return render(); }
  const g = e.target.closest("[data-go]"); if(g) return go(g.dataset.go);
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="speak"){ e.stopPropagation(); return speak(b.dataset.t); }
  switch(a){
    case "open-g": return openLesson("g", +b.dataset.i);
    case "open-v": return openLesson("v", b.dataset.t, +b.dataset.l);
    case "topic": S.topic = b.dataset.t; persist(); V.showWords=false; render(); if(window.innerWidth<900) document.querySelector(".banner")?.scrollIntoView({behavior:"smooth"}); return;
    case "toggle-words": V.showWords = !V.showWords; return render();
    case "flip": V.flipped = !V.flipped; return render();
    case "card": V.card += +b.dataset.d; V.flipped=false; if(!V.seen.includes(V.card)) V.seen.push(V.card); return render();
    case "start-test": return startTest();
    case "to-listen": V.phase="listen"; V.ltab="listen"; render(); return window.scrollTo(0,0);
    case "open-listen": openLesson("v", b.dataset.t, +b.dataset.l); V.phase="listen"; V.ltab="listen"; return render();
    case "ltab": if(rec) try{ rec.abort(); }catch(_){} V.recOn=false; V.ltab=b.dataset.tab; return render();
    case "play-all": if(PLAY.on) return stopPlay(); return playSentences(0);
    case "play-sent": { const root = b.closest("[data-root]"); if(root){ PLAY.list = splitSent(PLAY_SRC[root.id] || ""); return playSentences(+b.dataset.i, true, root.id); } return playSentences(+b.dataset.i, true); }
    case "play-root": { const r = b.dataset.root; if(PLAY.on && PLAY.root === r) return stopPlay(); const tx = (PLAY_SRC[r] || "").trim(); if(!tx) return toast("Chưa có nội dung để đọc."); PLAY.list = splitSent(tx); return playSentences(0, false, r); }
    case "open-story": { const st = storyState(), ws = topicById(V.topic).lessons[V.l]; Object.assign(st, {topic:V.topic, scope:String(V.l), sel:ws.map(w => w.w)}); store.set("chang.draft", st); return go("story"); }
    case "sw": { const st = storyState(), w = b.dataset.w;
      if(st.sel.includes(w)) st.sel = st.sel.filter(x => x !== w); else { if(st.sel.length >= 10) return toast("Chọn tối đa 10 từ cho một câu chuyện."); st.sel.push(w); }
      saveDraft(); return render(); }
    case "sw-random": { const st = storyState(); st.sel = shuffle(storyPool(st)).slice(0, 6).map(w => w.w); saveDraft(); return render(); }
    case "sw-clear": storyState().sel = []; saveDraft(); return render();
    case "idea": storyState().idea++; saveDraft(); return render();
    case "story-save": {
      const st = storyState(), sel = storySel(st);
      if(wordCount(st.text) < 10) return toast("Hãy viết ít nhất 10 từ trước khi lưu.");
      const used = sel.filter(w => findIn(st.text, w.w)).length;
      const rec_ = {id: st.id || "s" + Date.now().toString(36), topic: st.topic, title: st.title.trim(), text: st.text, words: st.sel.slice(), used, date: Date.now()};
      const isNew = !st.id; st.id = rec_.id;
      S.stories = [rec_].concat(S.stories.filter(x => x.id !== rec_.id)).slice(0, 60);
      store.set("chang.stories", S.stories); store.set("chang.draft", st);
      if(isNew && used) addXp(Math.min(20, used * 2));
      render(); return toast(isNew ? `Đã lưu truyện${used ? ` · +${Math.min(20, used*2)} XP` : ""}` : "Đã cập nhật truyện");
    }
    case "story-new": { const st = storyState(); S.story = {topic: st.topic, scope: st.scope, level: st.level, sel: st.sel, title: "", text: "", idea: st.idea + 1}; store.set("chang.draft", S.story); V.ai = {}; return render(); }
    case "story-open": { const x = S.stories.find(y => y.id === b.dataset.id); if(!x) return; const st = storyState();
      S.story = {id: x.id, topic: x.topic, scope: "all", level: st.level, sel: x.words.slice(), title: x.title, text: x.text, idea: st.idea}; store.set("chang.draft", S.story); V.ai = {}; render(); return window.scrollTo(0, 0); }
    case "story-del": V.delId = b.dataset.id; return render();
    case "story-del-no": V.delId = null; return render();
    case "story-del-yes": { S.stories = S.stories.filter(x => x.id !== b.dataset.id); store.set("chang.stories", S.stories); if(S.story && S.story.id === b.dataset.id) delete S.story.id; V.delId = null; render(); return toast("Đã xóa truyện"); }
    case "ai-feedback": if(sampleFn) aiFeedback(); return;
    case "tr-dir": V.tr.dir = b.dataset.dir; return refreshAI();
    case "tr-go": {
      const t = V.tr, text = (t.input || "").trim(), myV = V, dir = t.dir;
      if(!text) return toast("Hãy nhập nội dung cần dịch.");
      if(!sampleFn) return;
      Object.assign(t, {loading: true, error: ""}); refreshAI();
      aiTranslate(text, dir).then(out => { if(V !== myV) return; Object.assign(t, {loading: false, out, outDir: dir}); refreshAI(); })
        .catch(e => { if(V !== myV) return; Object.assign(t, {loading: false, error: aiErrText(e)}); refreshAI(); });
      return;
    }
    case "tr-insert": { const st = storyState(); st.text = (st.text.trim() ? st.text.trim() + " " : "") + V.tr.out; saveDraft();
      const ta = document.getElementById("story-text"); if(ta) ta.value = st.text; updateStoryLive(); return toast("Đã chèn bản dịch vào truyện"); }
    case "tr-copy": {
      const txt = V.tr.out;
      const fallback = () => { const el = document.getElementById("tr-out"); if(el){ const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); } toast("Không chép được, hãy chọn và chép thủ công."); };
      try{ navigator.clipboard.writeText(txt).then(() => toast("Đã chép"), fallback); }catch(_){ fallback(); }
      return;
    }
    case "tr-para": {
      const key = vKey(V.topic, V.l), text = PARAS[V.topic + ":" + V.l], myV = V;
      if(V.trP && V.trP.show){ V.trP = {}; return render(); }
      if(S.trCache[key]){ V.trP = {show: true}; return render(); }
      if(!sampleFn) return;
      V.trP = {show: true, loading: true}; render();
      aiTranslate(text, "en-vi").then(out => { S.trCache[key] = out; store.set("chang.trcache", S.trCache); if(V !== myV) return; V.trP = {show: true}; render(); })
        .catch(e => { if(V !== myV) return; const msg = aiErrText(e); V.trP = msg ? {show: true, error: msg} : {}; render(); });
      return;
    }
    case "ai-model": if(sampleFn) aiModel(); return;
    case "ai-stop": if(aiCtl) aiCtl.abort(); return;
    case "ai-use": { const f = V.ai && V.ai.feedback; if(!f) return; storyState().text = f.corrected; saveDraft(); render(); return toast("Đã thay bằng bản đã sửa"); }
    case "play-slow": { const r=S.rate; S.rate=.65; playSentences(+b.dataset.i, true); S.rate=r; return; }
    case "rate": S.rate=+b.dataset.r; store.set("chang.rate",S.rate); return render();
    case "toggle-text": V.hideText=!V.hideText; return render();
    case "toggle-para": V.showPara=!V.showPara; return render();
    case "dict-check": {
      const t=topicById(V.topic), text=PARAS[t.id+":"+V.l], ranges=wordRanges(text, t.lessons[V.l]);
      V.dict = V.dict || {}; ranges.forEach((r,n)=>{ const el=document.getElementById("gap-"+n); if(el) V.dict[n]=el.value; });
      V.dictRes = ranges.map((r,n)=>{ const v=norm(V.dict[n]||""); return !!v && (v===norm(text.substr(r.i,r.len)) || v===norm(r.w.w)); });
      const ok = V.dictRes.filter(Boolean).length;
      if(!V.dictScored){ V.dictScored=true; if(ok) addXp(ok*2); }
      markPractised(); render();
      return toast(ok===ranges.length ? "Tuyệt vời! Bạn nghe đúng tất cả các từ." : `Đúng ${ok}/${ranges.length} từ. Nghe lại đoạn văn và xem các từ còn sai.`);
    }
    case "dict-reset": V.dict={}; V.dictRes=null; return render();
    case "sh-move": V.si=Math.max(0,(V.si||0)+(+b.dataset.d)); return render();
    case "sh-done": {
      const n=splitSent(PARAS[V.topic+":"+V.l]).length; V.shDone=V.shDone||[];
      if(!V.shDone.includes(V.si||0)){ V.shDone.push(V.si||0); addXp(1); }
      if(V.shDone.length===n){ markPractised(); toast("Bạn đã nói theo cả đoạn văn!"); }
      if((V.si||0) < n-1) V.si=(V.si||0)+1; return render();
    }
    case "sh-mic": {
      if(V.recOn){ try{ rec && rec.stop(); }catch(_){} return; }
      const i=V.si||0, target=splitSent(PARAS[V.topic+":"+V.l])[i];
      const started = listenOnce(txt => { V.srRes=V.srRes||{}; V.srRes[i]=scoreSpeech(target, txt); }, () => { V.recOn=false; render(); });
      if(started){ V.recOn=true; render(); } else render();
      return;
    }
    case "kw": { V.used=V.used||[]; const k=+b.dataset.k; V.used = V.used.includes(k) ? V.used.filter(x=>x!==k) : V.used.concat(k); return render(); }
    case "rt-timer": {
      clearInterval(rtTimer); V.rtLeft=60; const el=document.getElementById("rt-clock"); if(el) el.textContent="1:00";
      rtTimer=setInterval(()=>{ V.rtLeft--; const c=document.getElementById("rt-clock"); if(!c){ clearInterval(rtTimer); return; }
        c.textContent="0:"+String(Math.max(0,V.rtLeft)).padStart(2,"0"); if(V.rtLeft<=0){ clearInterval(rtTimer); toast("Hết giờ! Bạn đã dùng được bao nhiêu từ?"); } },1000);
      return;
    }
    case "rt-mic": {
      if(V.recOn){ try{ rec && rec.stop(); }catch(_){} return; }
      const ws=topicById(V.topic).lessons[V.l];
      const started = listenOnce(txt => { V.rtHeard=txt; V.used=V.used||[]; ws.forEach((w,k)=>{ if(findIn(txt,w.w) && !V.used.includes(k)) V.used.push(k); }); }, () => { V.recOn=false; render(); });
      if(started){ V.recOn=true; render(); } else render();
      return;
    }
    case "rt-done": {
      const ws=topicById(V.topic).lessons[V.l], n=(V.used||[]).length;
      if(!V.rtScored){ V.rtScored=true; addXp(n); }
      markPractised(); render();
      return toast(n===ws.length ? "Xuất sắc! Bạn đã dùng đủ tất cả các từ." : `Bạn đã dùng ${n}/${ws.length} từ. Hãy thử kể lại một lần nữa.`);
    }
    case "pick": if(V.answered) return; { const i=+b.dataset.i; return answer(i===V.qs[V.qi].a, i); }
    case "next": if(V.qi+1 >= V.qs.length) return finishTest(); V.qi++; V.answered=false; V.pick=null; V.val=""; render(); return autoSpeak();
    case "retry": return startTest();
    case "relearn": V.phase="learn"; V.card=0; V.seen=[0]; V.flipped=false; V.dict={}; V.dictRes=null; render(); return window.scrollTo(0,0);
    case "practice": return startPractice();
  }
});
document.addEventListener("submit", e => {
  if(e.target.dataset.form === "dict"){ e.preventDefault(); return; }
  if(e.target.dataset.form !== "spell") return;
  e.preventDefault(); if(V.answered) return;
  const v = document.getElementById("spell-in").value; V.val = v;
  if(!norm(v)) return toast("Hãy nhập câu trả lời trước");
  answer(norm(v) === norm(V.qs[V.qi].answer), null);
});
document.addEventListener("keydown", e => {
  const typing = /^(input|textarea|select)$/i.test(e.target.tagName||"");
  if(V.phase==="learn" && V.kind==="v" && !typing){
    if(e.key===" "){ e.preventDefault(); V.flipped=!V.flipped; render(); }
    else if(e.key==="ArrowRight"){ const ws=topicById(V.topic).lessons[V.l]; if(V.card<ws.length-1) document.querySelector('[data-act="card"][data-d="1"]')?.click(); }
    else if(e.key==="ArrowLeft" && V.card>0) document.querySelector('[data-act="card"][data-d="-1"]')?.click();
  }
  if(V.phase==="listen"){
    if(e.target.classList && e.target.classList.contains("gap-in") && e.key==="Enter"){
      e.preventDefault(); const nx=document.getElementById("gap-"+(+e.target.dataset.n+1));
      if(nx) nx.focus(); else document.querySelector('[data-act="dict-check"]')?.click(); return;
    }
    if(e.key===" " && !typing && (V.ltab||"listen")!=="retell"){ e.preventDefault(); const pb = document.querySelector('[data-act="play-all"]') || document.querySelector('[data-act="play-sent"]'); if(pb) pb.click(); }
  }
  if(V.phase==="test"){
    const q = V.qs[V.qi];
    if(!V.answered && q.type==="mc" && !typing && /^[1-4]$/.test(e.key)) answer(+e.key-1===q.a, +e.key-1);
    else if(V.answered && e.key==="Enter"){ e.preventDefault(); document.getElementById("next-btn")?.click(); }
  }
});
document.addEventListener("change", e => {
  const id = e.target.id; if(!/^story-(topic|scope|level)$/.test(id)) return;
  const st = storyState();
  if(id === "story-topic"){ st.topic = e.target.value; st.scope = "0"; st.sel = []; }
  if(id === "story-scope") st.scope = e.target.value;
  if(id === "story-level") st.level = e.target.value;
  saveDraft(); render();
});
document.addEventListener("input", e => {
  if(e.target.id === "story-text"){ storyState().text = e.target.value; saveDraft(); return updateStoryLive(); }
  if(e.target.id === "story-title"){ storyState().title = e.target.value; return saveDraft(); }
  if(e.target.id === "tr-in"){ V.tr.input = e.target.value; return; }
  if(e.target.classList.contains("gap-in")){ V.dict=V.dict||{}; V.dict[e.target.dataset.n]=e.target.value; return; }
  if(e.target.id !== "topic-q") return;
  V.tq = e.target.value; const q = V.tq.toLowerCase().trim();
  document.querySelectorAll(".topic").forEach(b => { b.hidden = !!q && !b.dataset.n.toLowerCase().includes(q); });
});
window.addEventListener("hashchange", fromHash);
try{ speechSynthesis.getVoices(); }catch(e){}
applyTheme();
fromHash();
</script>
